<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chest Tracker · Popup</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
  /* Matches the MiniHUD panel (index.html): same tokens, type and surface. */
  :root {
    --alpha: .88;
    --bg: rgba(12, 13, 16, var(--alpha));
    --line: rgba(255, 255, 255, .07);
    --fill: rgba(255, 255, 255, .06);
    --fill-hi: rgba(255, 255, 255, .12);
    --fg: #eceef2;
    --muted: #8f96a3;
    --faint: #7c828d;
    --accent: #bec9d9;
    --gold: #e6bd67;
    --ember: #c99465;
    --stage: 5000ms;
  }
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 12px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  #panel { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px 10px; overflow: hidden; opacity: 0; transform: translateY(-4px); transition: opacity .22s ease-out, transform .22s ease-out; }
  #panel.in { opacity: 1; transform: none; cursor: pointer; }
  #panel.low { text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 1px rgba(0,0,0,.9); }
  #panel.clear { border-color: transparent; }

  #bar { display: flex; align-items: center; gap: 6px; height: 28px; }
  #bar .title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  #kicker { font-weight: 600; }
  #sub { color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
  #close { width: 22px; height: 22px; display: grid; place-items: center; font: inherit; color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: inherit; }
  #close:hover { color: var(--fg); background: var(--fill); }
  #close svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; fill: none; }

  /* Story-style progress: one segment per category. */
  #steps { display: flex; gap: 3px; margin: 0 0 9px; }
  #steps button { flex: 1; height: 8px; padding: 3px 0; border: 0; background: none; cursor: inherit; }
  #steps button i { display: block; height: 2px; border-radius: 1px; background: var(--fill-hi); overflow: hidden; }
  #steps button i::after { content: ''; display: block; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; }
  #steps button.done i::after { transform: scaleX(1); }
  #steps button.now i::after { animation: fill var(--stage) linear forwards; }
  #panel.paused #steps button.now i::after { animation-play-state: paused; }
  #label { color: var(--muted); font-size: 9px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 6px; }

  /* All stages share one grid cell so the panel keeps a steady height. */
  #stages { display: grid; }
  .stage { grid-area: 1 / 1; visibility: hidden; opacity: 0; transform: translateX(6px); transition: opacity .25s, transform .25s, visibility 0s .25s; }
  .stage.now { visibility: visible; opacity: 1; transform: none; transition: opacity .25s, transform .25s; }

  .num { font-size: 30px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .hero { display: flex; align-items: flex-end; gap: 8px; padding: 2px 0 10px; }
  .hero > span { color: var(--muted); font-size: 11px; line-height: 1.3; padding-bottom: 2px; }
  .hero em { font-style: normal; color: var(--fg); }
  .hero.streak .fire { width: 24px; height: 28px; color: var(--ember); fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; align-self: center; }
  .hero.streak.idle .fire, .hero.streak.idle .num { color: var(--faint); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat { padding: 6px 0 5px; display: flex; flex-direction: column; gap: 1px; }
  .stat + .stat { padding-left: 8px; border-left: 1px solid var(--line); }
  .stat span { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .04em; }
  .stat b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .foot { display: flex; align-items: center; gap: 5px; margin: 8px 0 0; color: var(--muted); font-size: 11px; min-width: 0; }
  .foot > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot em { font-style: normal; color: var(--fg); }
  .foot.dim { display: block; line-height: 1.45; }
  .crown { width: 13px; height: 13px; flex: none; color: var(--gold); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
  .swatch { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--player); flex: none; margin: 0 4px 0 3px; }

  .head, .share { display: grid; grid-template-columns: minmax(0,1fr) 42px 38px; gap: 8px; align-items: center; }
  .head { font-size: 9px; color: var(--muted); margin-bottom: 3px; }
  .head span:not(:first-child), .share b, .share .pct { text-align: right; }
  .share { grid-template-rows: 18px 3px; row-gap: 1px; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .share .who { display: flex; align-items: center; gap: 0; min-width: 0; }
  .share .who .crown { margin-right: 4px; }
  .share .who > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .share b { font-weight: 500; }
  .share .pct { color: var(--muted); font-size: 11px; }
  .share .track { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--fill); overflow: hidden; }
  .share .track i { display: block; height: 100%; background: var(--player); border-radius: 2px; transform-origin: left; transform: scaleX(0); }
  .stage.now .share .track i { animation: grow .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: var(--delay); }

  .list { border-top: 1px solid var(--line); padding-top: 4px; }
  .list .row { display: flex; justify-content: space-between; align-items: center; height: 20px; font-variant-numeric: tabular-nums; }
  .list .row span { display: flex; align-items: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .row b { font-weight: 500; }
  .list .row.none { color: var(--muted); }

  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid { stroke: var(--line); stroke-width: .6; fill: none; }
  .chart .line { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-dasharray: 600; stroke-dashoffset: 600; }
  .stage.now .chart .line { animation: draw 1.6s ease-out forwards; }
  .axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 9px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 7px; font-size: 11px; color: var(--muted); }
  .legend span { display: flex; align-items: center; }

  /* Streak broken */
  .broken { display: flex; align-items: center; gap: 10px; padding: 2px 0 2px; }
  .broken .fire { width: 26px; height: 30px; flex: none; color: var(--faint); fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; animation: douse 1.1s ease-out both; }
  .broken.mine .fire { animation-name: douse-mine; }
  .broken .what { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .broken .what b { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .broken .what span { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .broken .what em { font-style: normal; color: var(--fg); }
  .broken .run { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .broken .run .num { font-size: 24px; color: var(--muted); }
  .broken .run small { color: var(--faint); font-size: 9px; letter-spacing: .04em; }

  @keyframes fill { to { transform: scaleX(1); } }
  @keyframes grow { to { transform: scaleX(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes douse { 0% { color: var(--ember); } 100% { color: var(--faint); } }
  @keyframes douse-mine { 0% { color: var(--ember); transform: none; } 30% { transform: translateX(-1px) rotate(-4deg); } 60% { transform: translateX(1px) rotate(3deg); } 100% { color: var(--faint); transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    #panel, .stage { transition: none; transform: none; }
    .stage.now .share .track i, .stage.now .chart .line, .broken .fire { animation: none; transform: none; stroke-dashoffset: 0; }
    .share .track i { transform: none; }
    .chart .line { stroke-dashoffset: 0; }
  }
</style></head>
<body>
<div id="panel" role="status" aria-live="polite">
  <header id="bar">
    <div class="title"><span id="kicker"></span><span id="sub"></span></div>
    <button id="close" aria-label="Dismiss"><svg viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"/></svg></button>
  </header>
  <div id="steps"></div>
  <div id="label"></div>
  <div id="stages"></div>
</div>
<script src="match.js"></script><script src="popup.js"></script>
</body></html>
