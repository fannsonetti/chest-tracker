<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chest Tracker · Popup</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="tiers.css">
<style>
  /* Matches the MiniHUD panel (index.html): same tokens, type and surface. */
  :root {
    --alpha: .88;
    --bg: rgba(12, 13, 16, var(--alpha));
    --line: rgba(255, 255, 255, .07);
    --fill: rgba(255, 255, 255, .06);
    --fill-hi: rgba(255, 255, 255, .12);
    --fg: #eceef2;
    --muted: #8f96a3;
    --faint: #7c828d;
    --accent: #bec9d9;
    --gold: #e6bd67;
    --stage: 5000ms;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --spring: cubic-bezier(.3, 1.5, .5, 1);
  }
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 12px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }

  /* Recap: a large centred card that settles in from a soft blur. */
  #panel { width: 440px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 8px 16px 16px; overflow: hidden; opacity: 0; }
  #panel.in { opacity: 1; cursor: pointer; animation: card-in .55s var(--ease-out) both; }
  #panel.out { animation: card-out .24s cubic-bezier(.4,0,1,1) both; }
  #panel.low { text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 1px rgba(0,0,0,.9); }

  #bar { display: flex; align-items: center; gap: 8px; height: 32px; }
  #bar .title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  #kicker { font-size: 14px; font-weight: 600; }
  #sub { color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
  #close { width: 24px; height: 24px; display: grid; place-items: center; font: inherit; color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: inherit; }
  #close:hover { color: var(--fg); background: var(--fill); }
  #close svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; fill: none; }

  /* Story-style progress: one segment per category. */
  #steps { display: flex; gap: 4px; margin: 2px 0 12px; }
  #steps button { flex: 1; height: 9px; padding: 3px 0; border: 0; background: none; cursor: inherit; }
  #steps button i { display: block; height: 3px; border-radius: 2px; background: var(--fill-hi); overflow: hidden; }
  #steps button i::after { content: ''; display: block; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; }
  #steps button.done i::after { transform: scaleX(1); }
  #steps button.now i::after { animation: fill var(--stage) linear forwards; }
  #panel.paused #steps button.now i::after { animation-play-state: paused; }
  #label { color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; }

  /* All stages share one grid cell so the card keeps a steady height. Each
     stage slides in from the right; its parts rise in one after another. */
  #stages { display: grid; }
  .stage { grid-area: 1 / 1; visibility: hidden; opacity: 0; transform: translateX(18px); filter: blur(3px);
    transition: opacity .3s, transform .45s var(--ease-out), filter .3s, visibility 0s .45s; }
  .stage.now { visibility: visible; opacity: 1; transform: none; filter: none; transition: opacity .3s, transform .45s var(--ease-out), filter .3s; }
  .stage.gone { transform: translateX(-18px); }
  .rise { opacity: 0; transform: translateY(8px); }
  .stage.now .rise { animation: rise .5s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms + 80ms); }
  .pop { opacity: 0; transform: scale(.86); }
  .stage.now .pop { animation: pop .55s var(--spring) both; animation-delay: calc(var(--i, 0) * 110ms + 100ms); }

  .num { font-size: 34px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .hero { display: flex; align-items: flex-end; gap: 10px; padding: 2px 0 14px; }
  .hero.big .num { font-size: 56px; letter-spacing: -.03em; }
  .hero > span { color: var(--muted); font-size: 12px; line-height: 1.3; padding-bottom: 4px; }
  .hero em { font-style: normal; color: var(--fg); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stats.four { grid-template-columns: repeat(4, 1fr); }
  .stat { padding: 9px 0 8px; display: flex; flex-direction: column; gap: 2px; }
  .stat + .stat { padding-left: 10px; border-left: 1px solid var(--line); }
  .stat span { color: var(--muted); font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; }
  .stat b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .foot { display: flex; align-items: center; gap: 6px; margin: 12px 0 0; color: var(--muted); font-size: 12px; min-width: 0; }
  .foot > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot em { font-style: normal; color: var(--fg); }
  .foot.dim { display: block; line-height: 1.45; font-size: 11px; }
  .crown, .star { width: 14px; height: 14px; flex: none; color: var(--gold); fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
  .swatch { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--player); flex: none; margin: 0 6px 0 3px; }

  /* Replay: the match played back as a race, clock and ticker included. */
  .replay-head { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .replay-head .clock { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .replay-head .dim { color: var(--muted); }
  .race { display: grid; grid-template-columns: 112px minmax(0, 1fr) 34px; gap: 10px; align-items: center; height: 26px; font-variant-numeric: tabular-nums; }
  .race .who { display: flex; align-items: center; min-width: 0; }
  .race .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .race .lane { height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; }
  .race .lane i { display: block; height: 100%; width: 100%; border-radius: 4px; background: var(--player); transform-origin: left; transform: scaleX(0); }
  .race b { text-align: right; font-size: 14px; font-weight: 600; }
  .race b.bump { animation: bump .35s var(--spring); }
  .ticker { height: 28px; margin-top: 10px; display: flex; align-items: center; }
  .ticker .note { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 9px; border-radius: 13px; background: var(--fill); font-size: 12px;
    animation: note-in .4s var(--spring) both; }
  .ticker .note svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .ticker .note.first svg, .ticker .note.last svg { color: var(--accent); }
  .ticker .note.streak .fire { color: var(--tier); }

  /* Awards: cards that spring in one at a time. */
  .awards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .award { position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 9px; row-gap: 1px; align-items: center; padding: 10px 11px; border-radius: 10px; background: var(--fill); overflow: hidden; }
  .award > svg, .award > span:first-child { grid-row: 1 / 4; width: 22px; height: 22px; display: grid; place-items: center; }
  .award > svg, .award > span:first-child svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .award .what { color: var(--muted); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; }
  .award b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .award small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .award.first, .award.last { color: var(--accent); }
  .award.points { color: var(--gold); }
  .award.streak > span:first-child { color: var(--tier); }
  .award b, .award small { color: var(--fg); }
  .award small { color: var(--muted); }
  /* A soft glint sweeps each card once as it lands. */
  .award::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.09) 50%, transparent 65%); transform: translateX(-100%); }
  .stage.now .award::after { animation: glint .9s ease-out both; animation-delay: calc(var(--i, 0) * 110ms + 380ms); }

  .head, .share { display: grid; grid-template-columns: minmax(0,1fr) 52px 46px; gap: 10px; align-items: center; }
  .head { font-size: 9.5px; color: var(--muted); letter-spacing: .04em; margin-bottom: 4px; }
  .head span:not(:first-child), .share b, .share .pct { text-align: right; }
  .share { grid-template-rows: 22px 4px; row-gap: 2px; padding: 4px 0; font-size: 13px; font-variant-numeric: tabular-nums; }
  .share .who { display: flex; align-items: center; gap: 0; min-width: 0; }
  .share .who .crown, .share .who .star { margin-right: 5px; }
  .share .who > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .share b { font-weight: 600; }
  .share .pct { color: var(--muted); font-size: 12px; }
  .share .track { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
  .share .track i { display: block; height: 100%; background: var(--player); border-radius: 2px; transform-origin: left; transform: scaleX(0); }
  .stage.now .share .track i { animation: grow .9s var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 90ms + 200ms); }

  .hero.streak .fire { width: 32px; height: 38px; color: var(--tier, var(--c-red)); filter: drop-shadow(0 0 5px var(--tier-glow, transparent)); fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; align-self: center; }
  .hero.streak .num { color: var(--tier, var(--fg)); }
  .hero.streak.idle .fire, .hero.streak.idle .num { color: var(--faint); filter: none; }
  .list { border-top: 1px solid var(--line); padding-top: 6px; }
  .list .row { display: flex; justify-content: space-between; align-items: center; height: 24px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .list .row span { display: flex; align-items: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .row b { font-weight: 600; }
  .list .row b[class*=tier-] { color: var(--tier); }
  .list .row.none { color: var(--muted); }

  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid { stroke: var(--line); stroke-width: .6; fill: none; }
  .chart .line { fill: none; stroke-width: 1.8; stroke-linejoin: round; stroke-dasharray: 900; stroke-dashoffset: 900; }
  .stage.now .chart .line { animation: draw 2s var(--ease-out) forwards; animation-delay: var(--d, 0ms); }
  .axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 10px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 9px; font-size: 12px; color: var(--muted); }
  .legend span { display: flex; align-items: center; }

  /* Pills (streak taken, personal best): only the feat itself. */
  #panel.pill-kind { position: relative; overflow: visible; width: max-content; max-width: 460px; border-radius: 999px; padding: 9px 24px 9px 14px; }
  body.pill-body { padding: var(--pad, 28px); }   /* room for glow and sparks: popup.js PILL_PAD / RARE pad */
  #panel.pill-kind #bar, #panel.pill-kind #steps, #panel.pill-kind #label { display: none; }
  #panel.pill-kind.in { animation-name: drop-in; animation-duration: .5s; }
  #panel.pill-kind.out { animation-name: rise-out; animation-duration: .26s; }
  #panel.pill-kind .stage { transform: none; filter: none; transition: none; }

  /* Streak taken: holder struck through, flame cools, the reel rolls to the
     taker, and the flame relights in the taker's tier colour. --from / --to
     (and their -glow) come from the tier tokens in tiers.css. */
  .taken, .tierup, .best, .lost { display: flex; align-items: center; gap: 12px; }
  .taken { zoom: 1.3; }
  .pill-kind .flame { position: relative; width: 30px; height: 34px; flex: none; display: grid; place-items: center; }
  .flame .fire { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .flame .fire .core path:first-child { fill: color-mix(in srgb, currentColor 16%, transparent); }
  .ring-from .fire .ring, .ring-to .fire .ring { display: inline; stroke: url(#rainbow-wave); stroke-width: 3.4; fill: none; }
  .taken .fire { color: var(--from); filter: drop-shadow(0 0 6px var(--from-glow)); animation: cool .4s .75s ease-out forwards, relight .55s 1.5s ease-out forwards; }
  /* Prism / void ring: fades as the flame cools, and comes back for a ringed taker. */
  .taken.ring-from .fire .ring { animation: fade-out .35s .75s forwards; }
  .taken.ring-to:not(.ring-from) .fire .ring { opacity: 0; animation: fade-in .45s 1.5s forwards; }
  .taken.ring-from.ring-to .fire .ring { animation: fade-out .35s .75s forwards, fade-in .45s 1.5s forwards; }
  .taken .slot { height: 28px; overflow: hidden; }
  .taken .reel { display: flex; flex-direction: column; animation: roll .5s 1.45s cubic-bezier(.7,0,.25,1) forwards; }
  .pill-kind .line { height: 28px; display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .taken .struck { position: relative; display: inline-flex; align-items: center; gap: 9px; animation: dim .3s .95s ease-out forwards; }
  .taken .struck::after { content: ''; position: absolute; left: -3px; right: -3px; top: 52%; height: 2px; border-radius: 1px; background: var(--fg);
    transform: scaleX(0); transform-origin: left; animation: strike-x .38s .6s cubic-bezier(.65,0,.35,1) forwards; }
  .taken .name { overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  .pill-kind .count { min-width: 26px; height: 21px; padding: 0 8px; border-radius: 11px; display: inline-grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums;
    color: var(--tier); background: color-mix(in srgb, var(--tier) 15%, transparent); }
  .tier-void .count { background: color-mix(in srgb, #b98cff 22%, transparent); }
  .taken .new .count { animation: pop .4s 1.9s var(--spring) both; }
  .taken .new.me .name { color: var(--gold); }
  #panel.pill-kind.mine { border-color: rgba(240, 144, 127, .32); }
  .mine .flame { animation: shake .45s .75s ease-in-out; }

  /* Streak ran out: a round pill; the flame shudders and gutters, then
     sinks into a glowing ember at its base that dims and goes out. */
  #panel.round-kind { width: 64px; height: 64px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
  #panel.round-kind #stages { place-items: center; }
  #panel.round-kind.in { animation-name: drop-in, round-cool; animation-duration: .5s, .6s; animation-delay: 0s, 1.2s; animation-fill-mode: both; }
  .lost .flame { animation: shake .45s .3s ease-in-out, flicker .7s .7s steps(1) both; }
  .lost .fire { color: var(--from); filter: drop-shadow(0 0 6px var(--from-glow)); animation: burn-out 1.1s .75s ease-in forwards; transform-origin: 50% 90%; }
  .lost.ring-from .fire .ring { animation: fade-out .5s .7s forwards; }
  .lost .ember { position: absolute; left: 50%; bottom: 3px; width: 8px; height: 5px; margin-left: -4px; border-radius: 50%; background: var(--from);
    box-shadow: 0 0 6px 2px var(--from-glow); opacity: 0; animation: ember-glow 1.5s 1.25s ease-out forwards; }
  @keyframes burn-out { 0% { color: var(--from); transform: none; } 30% { transform: scale(1.08, .94); }
    100% { color: var(--from); filter: drop-shadow(0 0 0 transparent); transform: scale(.12, .05); opacity: 0; } }
  @keyframes flicker { 0%, 30%, 60% { opacity: 1; } 15%, 45% { opacity: .45; } 75% { opacity: .8; } }
  @keyframes ember-glow { 0% { opacity: 0; transform: scale(1.4); } 15% { opacity: 1; } 35% { opacity: .7; } 50% { opacity: 1; } 100% { opacity: 0; transform: scale(.4); background: var(--faint); box-shadow: none; } }
  @keyframes round-cool { to { border-color: rgba(255, 255, 255, .04); } }

  /* New flame colour, personal best and record: the icon ignites; the rarer
     the moment (--hype 1-6), the bigger the swell, the more sparks, and from
     .big a second shockwave and a jolt, from .huge a flash and a shimmer. */
  .pill-kind .text { display: flex; flex-direction: column; }
  .kicker { font-size: 9.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--to); opacity: .9; margin-bottom: -3px; animation: name-in .4s calc(.55s + var(--at, 0s)) var(--ease-out) both; }
  .tierup.ring-to .kicker { color: #d9c6ff; }
  .tierup .fire { color: var(--from); filter: drop-shadow(0 0 5px var(--from-glow)); animation: ignite .7s calc(.4s + var(--at, 0s)) var(--spring) forwards; }
  .tierup.ring-to .fire .ring { opacity: 0; animation: fade-in .5s calc(.6s + var(--at, 0s)) forwards; }
  .tierup .count { animation: pop .45s calc(.75s + var(--at, 0s)) var(--spring) both; }
  .burst .flame::before, .burst .flame::after { content: ''; position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    border: 2px solid var(--to); box-shadow: 0 0 8px var(--to-glow); opacity: 0; pointer-events: none; animation: wave .75s calc(.5s + var(--at, 0s)) ease-out; }
  .tierup.ring-to .flame::before, .tierup.ring-to .flame::after { border-color: #d9c6ff; }
  .burst .flame::after { display: none; animation-delay: calc(.72s + var(--at, 0s)); }
  .burst.big .flame::after { display: block; }
  .spark { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--to); box-shadow: 0 0 6px var(--to-glow); opacity: 0;
    animation: spark .8s calc(.5s + var(--at, 0s) + var(--t)) cubic-bezier(.2, .7, .3, 1) both; }
  .best.record .spark:nth-child(3n) { background: #fff; }
  .tierup.ring-to .spark { background: #fff; }
  .tierup.ring-to .spark:nth-child(3n+1) { background: #ffb3c4; }
  .tierup.ring-to .spark:nth-child(3n+2) { background: #aed8ff; }
  .burst .line { font-size: calc(19px + var(--hype) * .8px); }
  #panel[data-hype] { border-color: color-mix(in srgb, var(--edge) 55%, transparent);
    box-shadow: 0 0 calc(var(--hype) * 5px) var(--glow), inset 0 0 calc(var(--hype) * 3px) color-mix(in srgb, var(--glow) 40%, transparent); }
  #panel.in.hype-big { animation: drop-in .5s var(--ease-out) both, jolt .45s calc(.55s + var(--at, 0s)) ease-in-out; }
  #panel.pill-kind::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--glow); opacity: 0; pointer-events: none; }
  #panel.in.hype-huge::before { animation: flash .7s calc(.5s + var(--at, 0s)) ease-out; }
  .best.huge .line { background: linear-gradient(100deg, var(--fg) 40%, #fff 50%, var(--fg) 60%) 200% 0 / 250% 100%; -webkit-background-clip: text; background-clip: text;
    color: transparent; animation: name-in .4s .25s var(--ease-out) both, shimmer 1.6s 1s ease-in-out 2; }

  /* Personal best / record: a gold trophy that pops in. */
  #panel.best-kind { border-color: rgba(230, 189, 103, .35); }
  .best .trophy { width: 28px; height: 28px; color: var(--gold); fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(230, 189, 103, .55)); animation: pop .5s .15s var(--spring) both, trophy-up .7s .45s var(--spring); }
  .best.record .trophy { width: 32px; height: 32px; filter: drop-shadow(0 0 10px rgba(245, 200, 76, .85)); }
  .best .line { font-variant-numeric: tabular-nums; animation: name-in .4s .25s var(--ease-out) both; }
  @keyframes ignite { 0% { color: var(--from); transform: none; } 45% { transform: scale(calc(1.15 + var(--hype, 1) * .09)); filter: drop-shadow(0 0 calc(8px + var(--hype, 1) * 2px) var(--to-glow)); }
    100% { color: var(--to); transform: none; filter: drop-shadow(0 0 7px var(--to-glow)); } }
  @keyframes wave { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(calc(1.6 + var(--hype, 1) * .35)); } }
  @keyframes spark { 0% { opacity: 1; transform: rotate(var(--a)) translateX(4px) scale(1.2); } 100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scale(.3); } }
  @keyframes jolt { 20% { transform: translateX(-3px) rotate(-.6deg); } 40% { transform: translateX(3px) rotate(.6deg); } 60% { transform: translateX(-2px); } 80% { transform: translateX(1px); } }
  @keyframes flash { 0% { opacity: 0; } 20% { opacity: .55; } 100% { opacity: 0; } }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -50% 0; } }
  @keyframes trophy-up { 45% { transform: scale(calc(1.1 + var(--hype, 1) * .07)) rotate(-8deg); } }


  /* ---------- The three rare colours: each its own scene, each bigger ----------
     They spill well past the pill (popup.js gives them more glow room).
     --at delays the usual ignite, sparks and shockwaves until the scene's
     climax: Celestial 0s, Eclipse .9s, Supernova 1.15s. */
  .fx { position: absolute; left: 50%; top: 50%; pointer-events: none; }

  /* Celestial: light breaks through. Slow-turning rays fan out behind the
     flame, a halo settles over it, and stars twinkle around the pill. */
  .t-celestial .rays { width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%; z-index: -1;
    background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .5) 0 5deg, transparent 5deg 22deg);
    -webkit-mask: radial-gradient(circle, #000 12%, transparent 68%); mask: radial-gradient(circle, #000 12%, transparent 68%);
    opacity: 0; animation: rays 3.2s .35s ease-out forwards; }
  .t-celestial .halo { width: 26px; height: 8px; margin: -26px 0 0 -13px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 8px #fff, 0 0 16px rgba(210, 190, 255, .9);
    opacity: 0; animation: halo 1.2s .7s var(--spring) forwards; }
  .t-celestial .star { width: 9px; height: 9px; margin: -4.5px; opacity: 0; transform: translate(var(--x), var(--y)) scale(0);
    background: radial-gradient(circle, #fff 0 18%, transparent 20%), linear-gradient(#fff, #fff) center / 1.5px 100% no-repeat, linear-gradient(#fff, #fff) center / 100% 1.5px no-repeat;
    filter: drop-shadow(0 0 3px #fff); animation: twinkle 1.1s calc(.6s + var(--t)) ease-in-out 2; }
  @keyframes rays { 0% { opacity: 0; transform: scale(.3) rotate(0deg); } 25% { opacity: 1; } 70% { opacity: .8; } 100% { opacity: 0; transform: scale(1.15) rotate(70deg); } }
  @keyframes halo { from { opacity: 0; transform: translateY(-12px) scale(1.8); } to { opacity: 1; transform: none; } }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(0) rotate(0deg); } 50% { opacity: 1; transform: translate(var(--x), var(--y)) scale(1) rotate(45deg); } }

  /* Eclipse: the world goes dark. A shadow spreads past the pill, a rainbow
     corona lights up, a black moon slides over the flame, a diamond-ring glint
     flashes on its edge, and the corona blasts outward as the flame relights
     in black. */
  .t-eclipse .dusk { width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, rgba(6, 4, 12, .85) 0 30%, rgba(6, 4, 12, .5) 50%, transparent 70%); opacity: 0; animation: dusk 2.4s .2s ease-in-out forwards; }
  .t-eclipse .corona { width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; z-index: -1;
    background: conic-gradient(#ffb3c4, #ffd3ad, #fff0a6, #b8efc6, #aed8ff, #d3bdff, #ffb3c4); filter: blur(5px);
    opacity: 0; animation: corona-on .6s .35s ease-out forwards, corona-spin 3s .35s linear infinite, corona-blast .9s .95s cubic-bezier(.2, .7, .3, 1) forwards; }
  .t-eclipse .moon { width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; z-index: 2; background: #07050b;
    box-shadow: inset -3px -2px 6px rgba(255, 255, 255, .06), 0 0 0 1px rgba(255, 255, 255, .08); opacity: 0; animation: moon 1.5s .3s cubic-bezier(.45, 0, .2, 1) forwards; }
  .t-eclipse .glint { width: 7px; height: 7px; margin: -21px 0 0 9px; border-radius: 50%; z-index: 3; background: #fff;
    box-shadow: 0 0 6px 3px #fff, 0 0 18px 6px rgba(210, 190, 255, .9); opacity: 0; animation: glint-flash .45s .82s ease-out forwards; }
  @keyframes dusk { 0% { opacity: 0; transform: scale(.4); } 35%, 60% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(1.2); } }
  @keyframes corona-on { to { opacity: 1; } }
  @keyframes corona-spin { to { rotate: 360deg; } }
  @keyframes corona-blast { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(5); opacity: 0; } }
  @keyframes moon { 0% { opacity: 0; transform: translateX(-46px); } 15% { opacity: 1; } 45%, 62% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(44px); } }
  @keyframes glint-flash { 0% { opacity: 0; transform: scale(.2); } 40% { opacity: 1; transform: scale(1.6); } 100% { opacity: 0; transform: scale(.6); } }

  /* Supernova: the star collapses in on itself. Light is dragged into the
     flame as it crushes down to a white point and the pill is pulled in with
     it; then it detonates: a white-out, three shockwaves far past the pill, a
     wide spray of sparks, a hard shake, and the flame reborn in its
     colour-cycling corona. */
  .t-supernova .fire { transform-origin: 50% 60%;
    animation: nova-collapse 1s .15s cubic-bezier(.7, 0, .9, .5) forwards, nova-reborn .9s 1.15s var(--spring) forwards; }
  .t-supernova .inflow { width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px 1px var(--g-supernova);
    opacity: 0; animation: inflow .75s calc(.2s + var(--t)) cubic-bezier(.6, 0, 1, .6) forwards; }
  .t-supernova .point { width: 6px; height: 6px; margin: -3px; border-radius: 50%; z-index: 3; background: #fff; box-shadow: 0 0 6px 3px #fff, 0 0 18px 8px var(--g-supernova);
    opacity: 0; animation: point 1.3s .1s ease-in forwards; }
  .t-supernova .shock { width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 12px var(--g-supernova), inset 0 0 10px var(--g-supernova);
    opacity: 0; animation: shock 1.1s 1.15s cubic-bezier(.1, .7, .3, 1) forwards; }
  .t-supernova .shock.s2 { border-color: var(--c-supernova); animation-delay: 1.3s; animation-duration: 1.3s; }
  .t-supernova .shock.s3 { border-color: #ff6fb3; animation-delay: 1.48s; animation-duration: 1.5s; }
  .t-supernova .whiteout { width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%; z-index: 4;
    background: radial-gradient(circle, #fff 0 25%, rgba(255, 230, 180, .8) 45%, transparent 70%); opacity: 0; animation: whiteout .8s 1.12s ease-out forwards; }
  .t-supernova .spark { width: 5px; height: 5px; animation-duration: 1.2s; }
  .t-supernova .spark:nth-child(4n) { background: #fff; } .t-supernova .spark:nth-child(4n+1) { background: #ff6fb3; } .t-supernova .spark:nth-child(4n+2) { background: #7fd0ff; }
  #panel.in[data-tier=supernova] { animation: drop-in .5s var(--ease-out) both, pull-in .65s .5s cubic-bezier(.6, 0, 1, .5) forwards, detonate .7s 1.15s ease-out forwards; }
  #panel[data-tier=supernova].in::after { content: ''; position: absolute; inset: -3px; border-radius: inherit; pointer-events: none; border: 2px solid var(--c-supernova);
    opacity: 0; animation: nova-rim 3s 1.6s linear infinite, fade-in .4s 1.4s forwards; }
  @keyframes nova-collapse { 0% { transform: none; color: var(--from); } 25% { transform: scale(1.18); } 100% { transform: scale(.04); color: #fff; filter: drop-shadow(0 0 10px #fff) brightness(2); } }
  @keyframes nova-reborn { 0% { transform: scale(0); color: #fff; filter: drop-shadow(0 0 20px #fff) brightness(2); } 55% { transform: scale(1.9); }
    100% { transform: none; color: var(--to); filter: drop-shadow(0 0 9px var(--to-glow)); } }
  @keyframes inflow { 0% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)); } 20% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateX(2px) scale(.4); } }
  @keyframes point { 0%, 55% { opacity: 0; transform: scale(.4); } 80% { opacity: 1; transform: scale(1.5); } 88% { opacity: 1; transform: scale(.7); } 100% { opacity: 0; transform: scale(3); } }
  @keyframes shock { 0% { opacity: 1; transform: scale(.2); } 100% { opacity: 0; transform: scale(9); } }
  @keyframes whiteout { 0% { opacity: 0; transform: scale(.2); } 18% { opacity: 1; } 100% { opacity: 0; transform: scale(2.2); } }
  @keyframes pull-in { to { transform: scale(.9); } }
  @keyframes detonate { 0% { transform: scale(.9); } 15% { transform: scale(1.12) translateX(-5px) rotate(-1.4deg); } 30% { transform: scale(1.05) translateX(5px) rotate(1.2deg); }
    45% { transform: translateX(-4px) rotate(-.8deg); } 60% { transform: translateX(3px); } 80% { transform: translateX(-1px); } 100% { transform: none; } }
  @keyframes nova-rim { from { filter: hue-rotate(0deg) drop-shadow(0 0 4px var(--c-supernova)); } to { filter: hue-rotate(360deg) drop-shadow(0 0 4px var(--c-supernova)); } }

  @media (prefers-reduced-motion: reduce) {
    .fx, #panel[data-tier=supernova].in::after { display: none; }

    #panel.in[data-tier=supernova] { animation: none; }
  }

  @keyframes fill { to { transform: scaleX(1); } }
  @keyframes grow { to { transform: scaleX(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @keyframes bump { 40% { transform: scale(1.25); } }

  @keyframes glint { to { transform: translateX(100%); } }
  @keyframes card-in { from { opacity: 0; transform: scale(.94) translateY(10px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes card-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.97); filter: blur(3px); } }
  @keyframes drop-in { from { opacity: 0; transform: translateY(-110%) scale(.92); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }

  @keyframes shake { 25% { transform: translateX(-1.5px) rotate(-6deg); } 50% { transform: translateX(1.5px) rotate(5deg); } 75% { transform: translateX(-1px) rotate(-2deg); } }
  @media (prefers-reduced-motion: reduce) {
    #panel, .stage { transition: none; transform: none; filter: none; }
    #panel.in, #panel.out, #panel.pill-kind.in, #panel.pill-kind.out { animation: none; }
    #panel.out { opacity: 0; }
    .rise, .pop, .stage.now .rise, .stage.now .pop { animation: none; opacity: 1; transform: none; }

    .spark { display: none; }
    .lost .flame, .lost .fire, .lost .ember, #panel.round-kind.in, #panel[data-hype].in { animation: none; }
    .lost .fire { color: var(--faint); transform: scale(.6); }
    .lost .ember { display: none; }
    .stage.now .share .track i, .stage.now .chart .line, .taken .fire, .taken .new .count, .taken .struck, .mine .flame, .taken .fire .ring { animation: none; transform: none; stroke-dashoffset: 0; }
    .taken .struck::after { animation: none; transform: none; }
    .tierup .fire { animation: none; color: var(--to); }
