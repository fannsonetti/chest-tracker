<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Match summary</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="recap.css">
<style>
:root{color-scheme:dark;font:14px/1.5 'Segoe UI',sans-serif;color:#edf0f6;background:#101217}
*{box-sizing:border-box}body{margin:0;padding:28px 36px}header{display:flex;align-items:start;justify-content:space-between;gap:16px}
h1{font-size:26px;margin:0}#matchLabel{color:#a4acba;margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:1px}
button{font:inherit;cursor:pointer;border:1px solid #ffffff20;border-radius:8px;padding:10px 18px;background:#20242d;color:inherit}
button:focus-visible{outline:2px solid #f2c265;outline-offset:3px}
.total{font-size:40px;font-weight:600;margin:12px 0}.total small{font-size:14px;color:#a4acba;font-weight:400}
#summary .recap-meta,#summary .recap-axis,#summary .recap-person small,#summary .recap-timeline small{font-size:12px}
#summary .recap-highlight{font-size:14px;margin:16px 0}#summary .recap-player{font-size:14px}#summary .recap-person{margin:12px 0}
#summary .recap-track{height:5px;margin:5px 0}#summary .recap-timeline b{font-size:14px}
#summary .recap-timeline svg{max-height:190px}#summary .recap-timeline{margin-top:22px}
@media(max-width:480px){body{padding:20px}}
</style></head><body>
<header><div><p id="matchLabel">Match complete</p><h1>Squad recap</h1></div><button id="close" aria-label="Close summary">Close</button></header>
<div class="total"><span id="total">0</span> <small>team chests</small></div>
<main id="summary" aria-live="polite"></main>
<script src="match.js"></script><script src="recap.js"></script>
</body></html>
